apis:
- aid: prometheus:prometheus-remote-write-api
  name: Prometheus Remote Write API
  description: >-
    The Prometheus Remote Write API defines a standard protocol for sending time series data from Prometheus
    or compatible agents to remote storage backends via HTTP POST with Snappy-compressed protobuf payloads.
    The specification documents the wire format, required headers, and retry semantics for interoperable
    remote write implementations.
  humanURL: https://prometheus.io/docs/specs/prw/remote_write_spec/
  tags:
  - Integration
  - Remote Write
  - Storage
  - Time Series
  properties:
  - type: Documentation
    url: https://prometheus.io/docs/specs/prw/remote_write_spec/
  - type: Protobuf
    url: grpc/prometheus-remote.proto
  - type: Protobuf
    url: grpc/prometheus-types.proto
  - type: Protobuf
    url: grpc/prometheus-write-v2-types.proto
- aid: prometheus:prometheus-client-libraries
  name: Prometheus Client Libraries
  description: >-
    Prometheus provides official client libraries for Go, Java/Scala, Python, Ruby, and Rust that enable
    application instrumentation. Libraries implement the Prometheus metric types (Counter, Gauge, Histogram,
    Summary) and expose metrics via an HTTP endpoint for Prometheus to scrape.
  humanURL: https://prometheus.io/docs/instrumenting/clientlibs/
  tags:
  - Client Libraries
  - Instrumentation
  - Metrics
  - SDK
  properties:
  - type: Documentation
    url: https://prometheus.io/docs/instrumenting/clientlibs/
  - type: Reference
    url: https://prometheus.io/docs/instrumenting/writing_clientlibs/
